; ╔══════════════════════════════════════════════════════════════════╗
; ║              Macro Keyboard — PlatformIO Configuration          ║
; ║                   ESP32 Dev Module  |  Arduino Framework        ║
; ╚══════════════════════════════════════════════════════════════════╝

[platformio]
default_envs = esp32dev
src_dir      = src/main
include_dir  = include

; ── Common settings shared by all environments ────────────────────
[env]
platform  = espressif32
framework = arduino
board     = esp32dev

; ── Upload & Monitor ──────────────────────────────────────────────
upload_port   = /dev/ttyUSB0
upload_speed  = 921600
monitor_port  = /dev/ttyUSB0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; ── Partition scheme: huge_app (same as before) ───────────────────
board_build.partitions = huge_app.csv
board_build.flash_mode = dio

; ── Extra include paths so all headers are findable by filename ───
build_flags =
    -I apps
    -I games
    -I system
    -I data
    -I lib/heatshrink
    -DCORE_DEBUG_LEVEL=0
    -lqrcode

; ── Source filter: compile .cpp in all our source folders ─────────
build_src_filter =
    +<*>
    +<../../apps/*.cpp>
    +<../../games/*.cpp>
    +<../../system/*.cpp>
    +<../../lib/heatshrink/*.cpp>

; ── External libraries (auto-downloaded on first build) ───────────
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    bblanchon/ArduinoJson @ ^7.3.1
    Chris--A/Keypad @ ^3.1.1
    dvarrel/ESPping @ ^1.0.4
    h2zero/NimBLE-Arduino @ ^2.3.8

; ── Production build ─────────────────────────────────────────────
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -O2

; ── Debug build (verbose serial logging, no optimisation) ─────────
[env:debug]
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -O0
    -g
